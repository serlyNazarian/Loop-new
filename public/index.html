<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/loop-logo.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=5"
    />
    <meta name="theme-color" content="#5b00fd" />
    <meta
      name="description"
      content="Unify WhatsApp, Telegram, Instagram & more. Your AI agent handles replies 24/7."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/loop-logo.svg" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <script>
      (function () {
        try {
          if (localStorage.getItem('loop.theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <title>Loop — AI customer communication platform</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
